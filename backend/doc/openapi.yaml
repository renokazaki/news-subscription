---
openapi: 3.0.3
info:
  title: News Subscription API
  version: 1.0.0
  description: News Subscription REST API specification
servers: []
paths:
  "/api/v1/auth/sign_in":
    post:
      summary: create
      tags:
      - Api::V1::Auth::Session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                  required:
                  - email
                  - password
              required:
              - user
            example:
              user:
                email: test@example.com
                password: password123
      responses:
        '200':
          description: returns JWT token on successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      display_name:
                        type: string
                      profile_image:
                        nullable: true
                    required:
                    - id
                    - email
                    - display_name
                    - profile_image
                  token:
                    type: string
                required:
                - user
                - token
              example:
                user:
                  id: 53
                  email: test@example.com
                  display_name: Altha Collins
                  profile_image:
                token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI1MyIsInNjcCI6InVzZXIiLCJhdWQiOm51bGwsImlhdCI6MTc4Mjc0MjI0OSwiZXhwIjoxNzgyODI4NjQ5LCJqdGkiOiJkYjg1NjQ4Yi0yMzFmLTQwYTYtYWE0MS0wNDlmODBkYWQ0NDIifQ.wVLLu71Pz7rlqUQglYxSvRVIstW5ullnfQD2AkM-AG8
        '401':
          description: returns 401 on invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
              example:
                error: Invalid email or password
  "/api/v1/auth/sign_out":
    delete:
      summary: destroy
      tags:
      - Api::V1::Auth::Session
      responses:
        '200':
          description: logs out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
              example:
                message: Logged out successfully
  "/api/v1/auth/sign_up":
    post:
      summary: create
      tags:
      - Api::V1::Auth::Registration
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
                    display_name:
                      type: string
                  required:
                  - email
                  - password
                  - password_confirmation
                  - display_name
              required:
              - user
            example:
              user:
                email: new@example.com
                password: password123
                password_confirmation: password123
                display_name: New User
      responses:
        '201':
          description: creates a new user and returns JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      display_name:
                        type: string
                      profile_image:
                        nullable: true
                    required:
                    - id
                    - email
                    - display_name
                    - profile_image
                  token:
                    type: string
                required:
                - user
                - token
              example:
                user:
                  id: 52
                  email: new@example.com
                  display_name: New User
                  profile_image:
                token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiI1MiIsInNjcCI6InVzZXIiLCJhdWQiOm51bGwsImlhdCI6MTc4Mjc0MjI0NywiZXhwIjoxNzgyODI4NjQ3LCJqdGkiOiJmMTkwMWQzMy1jOTQzLTRkOWUtODYxYy1mNGU5MWE3MmEyN2MifQ.0BHDhPzKI2LpjYVedw5MRnfQENFvgltaXAWnLJvryxc
        '422':
          description: returns validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
              example:
                errors:
                - Email can't be blank
                - Password can't be blank
                - Display name can't be blank
  "/api/v1/interests":
    get:
      summary: index
      tags:
      - Api::V1::Interest
      responses:
        '200':
          description: returns all interests for the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    keyword:
                      type: string
                    created_at:
                      type: string
                  required:
                  - id
                  - keyword
                  - created_at
              example:
              - id: 12
                keyword: Rails
                created_at: '2026-06-29T14:10:51.098Z'
              - id: 11
                keyword: React
                created_at: '2026-06-29T14:10:51.081Z'
    post:
      summary: create
      tags:
      - Api::V1::Interest
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                interest:
                  type: object
                  properties:
                    keyword:
                      type: string
                  required:
                  - keyword
              required:
              - interest
            example:
              interest:
                keyword: TypeScript
      responses:
        '201':
          description: creates a new interest
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  keyword:
                    type: string
                  created_at:
                    type: string
                required:
                - id
                - keyword
                - created_at
              example:
                id: 13
                keyword: TypeScript
                created_at: '2026-06-29T14:10:51.227Z'
  "/api/v1/interests/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Interest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 15
      responses:
        '204':
          description: deletes the interest
    patch:
      summary: update
      tags:
      - Api::V1::Interest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 14
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                interest:
                  type: object
                  properties:
                    keyword:
                      type: string
                  required:
                  - keyword
              required:
              - interest
            example:
              interest:
                keyword: Vue
      responses:
        '200':
          description: updates the interest
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  keyword:
                    type: string
                  created_at:
                    type: string
                required:
                - id
                - keyword
                - created_at
              example:
                id: 14
                keyword: Vue
                created_at: '2026-06-29T14:10:51.263Z'
  "/api/v1/news":
    get:
      summary: index
      tags:
      - Api::V1::News
      responses:
        '200':
          description: filters by date
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    title:
                      type: string
                    tag:
                      type: string
                    published_at:
                      type: string
                    url:
                      type: string
                  required:
                  - id
                  - title
                  - tag
                  - published_at
                  - url
              example:
              - id: 33
                title: React 19 Released
                tag: React
                published_at: '2024-06-15T00:00:00.000Z'
                url: http://vandervort.example/miki
      parameters:
      - name: date
        in: query
        required: false
        schema:
          type: string
        example: '2024-06-15'
      - name: tag
        in: query
        required: false
        schema:
          type: string
        example: React
  "/api/v1/news/{id}":
    get:
      summary: show
      tags:
      - Api::V1::News
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 35
      responses:
        '200':
          description: returns news detail including text
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  title:
                    type: string
                  text:
                    type: string
                  tag:
                    type: string
                  url:
                    type: string
                  published_at:
                    type: string
                required:
                - id
                - title
                - text
                - tag
                - url
                - published_at
              example:
                id: 35
                title: Detail Test
                text: Full text here
                tag: TypeScript
                url: http://corkery.example/ronald
                published_at: '2026-06-17T08:56:13.000Z'
  "/api/v1/user":
    get:
      summary: show
      tags:
      - Api::V1::User
      responses:
        '200':
          description: returns the current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                  display_name:
                    type: string
                  profile_image:
                    nullable: true
                required:
                - id
                - email
                - display_name
                - profile_image
              example:
                id: 64
                email: james_gutmann@bogan.test
                display_name: Marty Prosacco
                profile_image:
