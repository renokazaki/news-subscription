---
openapi: 3.0.3
info:
  title: News Subscription API
  version: 1.0.0
  description: News Subscription REST API specification
servers: []
paths:
  "/api/v1/auth/sign_in":
    post:
      summary: create
      tags:
      - Api::V1::Auth::Session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                  required:
                  - email
                  - password
              required:
              - user
            example:
              user:
                email: test@example.com
                password: password123
      responses:
        '200':
          description: returns JWT token on successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      display_name:
                        type: string
                      profile_image:
                        nullable: true
                    required:
                    - id
                    - email
                    - display_name
                    - profile_image
                  token:
                    type: string
                required:
                - user
                - token
              example:
                user:
                  id: 20
                  email: test@example.com
                  display_name: Gordon Daugherty
                  profile_image:
                token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIyMCIsInNjcCI6InVzZXIiLCJhdWQiOm51bGwsImlhdCI6MTc4MjY1NTQyOCwiZXhwIjoxNzgyNzQxODI4LCJqdGkiOiJlYTdmMDJhNi0wY2QwLTQwOTMtODNjNS05Mzg2OWNlNDcyNTgifQ.cnpOYTffD9CQNWiW3Hbb_6xFoY74K7H03sIKjncuAJY
        '401':
          description: returns 401 on invalid credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
              example:
                error: Invalid email or password
  "/api/v1/auth/sign_up":
    post:
      summary: create
      tags:
      - Api::V1::Auth::Registration
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
                    display_name:
                      type: string
                  required:
                  - email
                  - password
                  - password_confirmation
                  - display_name
              required:
              - user
            example:
              user:
                email: new@example.com
                password: password123
                password_confirmation: password123
                display_name: New User
      responses:
        '201':
          description: creates a new user and returns JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: integer
                      email:
                        type: string
                      display_name:
                        type: string
                      profile_image:
                        nullable: true
                    required:
                    - id
                    - email
                    - display_name
                    - profile_image
                  token:
                    type: string
                required:
                - user
                - token
              example:
                user:
                  id: 19
                  email: new@example.com
                  display_name: New User
                  profile_image:
                token: eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxOSIsInNjcCI6InVzZXIiLCJhdWQiOm51bGwsImlhdCI6MTc4MjY1NTQyNiwiZXhwIjoxNzgyNzQxODI2LCJqdGkiOiIxYzhlMTU1NS1jYjU2LTQ0YWEtYjEyYi1mNjk3MWFjMmZmOTcifQ.JIF1PzOWu_Kg4vp-uPDz5A5mzDqa7CBVFuPpVZeFeIQ
        '422':
          description: returns validation errors
          content:
            application/json:
              schema:
                type: object
                properties:
                  errors:
                    type: array
                    items:
                      type: string
                required:
                - errors
              example:
                errors:
                - Email can't be blank
                - Password can't be blank
                - Display name can't be blank
  "/api/v1/interests":
    get:
      summary: index
      tags:
      - Api::V1::Interest
      responses:
        '200':
          description: returns all interests for the current user
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    keyword:
                      type: string
                    created_at:
                      type: string
                  required:
                  - id
                  - keyword
                  - created_at
              example:
              - id: 2
                keyword: Rails
                created_at: '2026-06-28T14:03:48.487Z'
              - id: 1
                keyword: React
                created_at: '2026-06-28T14:03:48.466Z'
    post:
      summary: create
      tags:
      - Api::V1::Interest
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                interest:
                  type: object
                  properties:
                    keyword:
                      type: string
                  required:
                  - keyword
              required:
              - interest
            example:
              interest:
                keyword: TypeScript
      responses:
        '201':
          description: creates a new interest
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  keyword:
                    type: string
                  created_at:
                    type: string
                required:
                - id
                - keyword
                - created_at
              example:
                id: 3
                keyword: TypeScript
                created_at: '2026-06-28T14:03:48.831Z'
  "/api/v1/interests/{id}":
    delete:
      summary: destroy
      tags:
      - Api::V1::Interest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 5
      responses:
        '204':
          description: deletes the interest
    patch:
      summary: update
      tags:
      - Api::V1::Interest
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        example: 4
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                interest:
                  type: object
                  properties:
                    keyword:
                      type: string
                  required:
                  - keyword
              required:
              - interest
            example:
              interest:
                keyword: Vue
      responses:
        '200':
          description: updates the interest
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  keyword:
                    type: string
                  created_at:
                    type: string
                required:
                - id
                - keyword
                - created_at
              example:
                id: 4
                keyword: Vue
                created_at: '2026-06-28T14:03:48.872Z'
  "/api/v1/user":
    get:
      summary: show
      tags:
      - Api::V1::User
      responses:
        '401':
          description: invalidates the JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                required:
                - error
              example:
                error: Unauthorized
